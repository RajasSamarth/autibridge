<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babylon.js Games Menu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
      color: #fff;
    }
    h1 {
      margin-bottom: 30px;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    a {
      text-decoration: none;
    }
    .btn {
      padding: 12px 30px;
      font-size: 18px;
      background: #3a86ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
      text-align: center;
      display: inline-block;
      width: 200px;
    }
    .btn:hover {
      background: #265dc4;
    }
  </style>
</head>
<body>
  <h1>Choose a Game</h1>
  <div class="buttons">
    <a href="https://vtange.github.io/boxgun/" target="_blank" class="btn">Game 1</a>
    <a href="https://veljko85.github.io/viperman/" target="_blank" class="btn">Game 2</a>
    <a href="https://pryme8.github.io/LSBAG/" target="_blank" class="btn">Game 3</a>
    <a href="https://tomwhall.github.io/p2BabylonUnicycle/" target="_blank" class="btn">Game 4</a>
  </div>
</body>
</html>
