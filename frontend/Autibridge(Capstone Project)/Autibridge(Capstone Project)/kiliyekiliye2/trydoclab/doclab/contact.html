<!doctype html>
<html lang="en">
<head>
  <script>
    if (localStorage.getItem('isLoggedIn') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — AutiBridge</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#97a0b6;
      --accent1:linear-gradient(135deg,#7b61ff 0%,#3ec5ff 100%);
      --glass: rgba(255,255,255,0.03);
      --glass-strong: rgba(255,255,255,0.05);
      --radius:20px;
      --maxw:650px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(124,81,255,0.12), transparent 6%),
                  radial-gradient(1000px 500px at 90% 90%, rgba(62,197,255,0.06), transparent 6%),
                  var(--bg);
      color:#e6eef8;
      -webkit-font-smoothing:antialiased;
      padding:20px;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height: 100vh;
    }
    .container {
      width:100%;
      max-width:var(--maxw);
    }

    .card{
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border-radius:var(--radius);
      padding:40px;
      border:1px solid rgba(255,255,255,0.05);
      box-shadow: 0 20px 50px rgba(2,6,23,0.7);
    }

    .hero{
      display:flex;gap:20px;align-items:center;margin-bottom:24px;
    }
    .logo{
      background:var(--accent1);
      width:64px;height:64px;border-radius:14px;display:grid;place-items:center;flex:0 0 64px;
      box-shadow:0 8px 30px rgba(124,81,255,0.2);
    }
    h1{margin:0;font-size:22px;font-weight:700}
    p.lead{margin:6px 0 0;color:var(--muted);font-size:15px;line-height:1.5}

    .info-list{display:grid;grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:16px;margin:24px 0}
    .info-item{display:flex;gap:12px;align-items:center;background:var(--glass);padding:12px;border-radius:12px}
    .info-icon{width:40px;height:40px;border-radius:10px;background:var(--glass-strong);display:grid;place-items:center;flex:0 0 40px;color:#3ec5ff}
    .info-text{font-size:14px;color:#dce9ff}
    .info-text strong{display:block;font-size:13px;color:#fff}
    .info-text small{color:var(--muted);font-size:12px}

    form .row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    @media (max-width:520px){form .row{grid-template-columns:1fr}}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
    input[type=text],input[type=email],textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.2);color:inherit;font-size:14px;outline:none;transition:border-color 0.2s}
    input:focus, textarea:focus{border-color:#7b61ff}
    textarea{min-height:120px;resize:vertical}
    
    .btn-group {display:flex;gap:12px;margin-top:20px;align-items:center}
    
    /* 🎯 UNIFIED BUTTON DESIGN */
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:12px 24px;
      border-radius:10px;
      border:0;
      cursor:pointer;
      font-weight:600;
      font-size:14px;
      transition: transform 0.1s, box-shadow 0.2s;
      text-decoration: none; /* Required for the Dashboard Link */
    }
    .btn:active{transform:scale(0.98)}
    
    /* 🎯 BOTH BUTTONS USE THIS PRIMARY DESIGN */
    .btn.primary{
      background:var(--accent1);
      color:#051026;
      box-shadow: 0 8px 20px rgba(62, 197, 255, 0.15);
    }
    .btn.primary:hover {
      box-shadow: 0 10px 25px rgba(62, 197, 255, 0.25);
    }

    .small{font-size:12px;color:var(--muted);margin-top:20px;text-align:center;display:block}
  </style>
</head>
<body>
  <div class="container">
    <main class="card">
      <div class="hero">
        <div class="logo" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <h1>Get in touch — we’d love to help</h1>
          <p class="lead">Leave a message and we’ll respond within 24–48 hours.</p>
        </div>
      </div>

      <section class="info-list">
        <div class="info-item">
          <div class="info-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div class="info-text">
            <strong>Head Office</strong>
            <small>VIT Bhopal, India</small>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92V21a1 1 0 0 1-1 1 19 19 0 0 1-8.63-2.76 19 19 0 0 1-6-6A19 19 0 0 1 2 3a1 1 0 0 1 1-1h4.09a1 1 0 0 1 1 .75c.12.62.34 1.61.7 2.72a1 1 0 0 1-.24 1l-1.2 1.2a16 16 0 0 0 6 6l1.2-1.2a1 1 0 0 1 1-.24c1.11.36 2.1.58 2.72.7a1 1 0 0 1 .75 1V21z"/></svg>
          </div>
          <div class="info-text">
            <strong>Call us</strong>
            <small>+91 70047 03274</small>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <div class="info-text">
            <strong>Email</strong>
            <small>rajassamarth15@gmail.com</small>
          </div>
        </div>
      </section>

      <form action="https://docs.google.com/forms/d/e/YOUR_FORM_ID/formResponse" method="POST" target="_blank">
        <div class="row">
          <div>
            <label for="name">Name</label>
            <input id="name" name="entry.2005620554" type="text" placeholder="Full name" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="entry.1045781291" type="email" placeholder="you@domain.com" required />
          </div>
        </div>

        <div style="margin-top:12px">
          <label for="subject">Subject</label>
          <input id="subject" name="entry.1166974658" type="text" placeholder="Short subject" />
        </div>

        <div style="margin-top:12px">
          <label for="message">Message</label>
          <textarea id="message" name="entry.839337160" placeholder="Type your message here..."></textarea>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn primary">Send message</button>
          <a class="btn primary" href="index.html">Back to Dashboard</a>
        </div>
      </form>

      <span class="small">Prefer quick replies? Call the number above or visit us at VIT Bhopal University.</span>
    </main>
  </div>
</body>
</html>
